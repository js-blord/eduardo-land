<!DOCTYPE html>
<html lang="en">
    <!--
INTRADIMENSIONAL COMMUNICATION NETWORK V1.0.0
SOUTH D172 AHAM PLANT CONNECTION STABLE
ALIEN CONNECTION UNRELIABLE 
STABILIZATION IN PROGRESS
RECOMMEND FINDING HIGHER GROUND
-->

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="look.css">
    <title>Login</title>
</head>

<body>
    <!-- Flicker overlay sections for CRT screen effect -->
    <div class="flicker-section flicker-top-left"></div>
    <div class="flicker-section flicker-top-right"></div>
    <div class="flicker-section flicker-middle-left"></div>
    <div class="flicker-section flicker-middle-right"></div>
    <div class="flicker-section flicker-bottom-left"></div>
    <div class="flicker-section flicker-bottom-right"></div>

    <form action="/login" method="post">
        <div class="container">
            <label for="UID"><b> </b></label>
            <input type="text" id="UID" placeholder=" " name="uname" >

            <label for="PW"><b> </b></label>
            <input type="password" id="PW" placeholder=" " name="psw" >

            <button type="submit"> </button>
        </div>
    </form>
    <script>
        // Fetch the sequences from the server
        fetch('/api/final-sequences')
            .then(response => response.json())
            .then(sequences => {
                const style = document.createElement('style');
                let dynamicCSS = '';
                
                // CSS States mapping back to your look.css visual style
                const offState = `opacity: 0.05; background: rgba(0, 255, 0, 0.02);`;
                const onState = `opacity: 0.25; background: rgba(0, 255, 0, 0.12);`;
                const totalDurationMs = 8000; // 8 second cycle
                
                // Build dynamic keyframes and attach classes for each sequence
                for (const [sectionName, sequenceCode] of Object.entries(sequences)) {
                    // Use a selector class matching your look.css naming convention
                    const targetClass = `.flicker-${sectionName}`; 
                    const animationName = `${sectionName}-anim-dynamic`;
                    let currentTime = 0;
                    
                    let keyframes = `@keyframes ${animationName} {\n`;
                    keyframes += `  0% { ${offState} }\n`;
                    
                    for (let i = 0; i < sequenceCode.length; i++) {
                        const char = sequenceCode[i];
                        let isOn = false;
                        let duration = 0;
                        
                        if (char === '.') { isOn = true; duration = 200; }
                        else if (char === '-') { isOn = true; duration = 600; }
                        else if (char === '/') { currentTime += 400; continue; }
                        else if (char === ' ') { currentTime += 1200; continue; }
                        
                        if (isOn) {
                            let startPct = (currentTime / totalDurationMs * 100);
                            let endPct = ((currentTime + duration) / totalDurationMs * 100);
                            
                            keyframes += `  ${Math.max(0, startPct - 0.1).toFixed(2)}% { ${offState} }\n`;
                            keyframes += `  ${startPct.toFixed(2)}% { ${onState} }\n`;
                            keyframes += `  ${endPct.toFixed(2)}% { ${onState} }\n`;
                            keyframes += `  ${Math.min(100, endPct + 0.1).toFixed(2)}% { ${offState} }\n`;
                            
                            currentTime += duration;
                            
                            // 200ms gap between symbols of the same letter
                            if (i + 1 < sequenceCode.length && (sequenceCode[i+1] === '.' || sequenceCode[i+1] === '-')) {
                                currentTime += 200;
                            }
                        }
                    }
                    keyframes += `  100% { ${offState} }\n}\n`;
                    
                    // Assign the generated animation to the specific HTML element class
                    dynamicCSS += keyframes;
                    dynamicCSS += `${targetClass} {\n  animation: ${animationName} 8s infinite;\n}\n`;
                }
                
                style.innerHTML = dynamicCSS;
                document.head.appendChild(style);
            })
            .catch(err => console.error('Failed to load:', err));
    </script>
</body>
</html>
