<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="look.css">
    <title>Inbox</title>
    <style>
        /* Inbox-specific styles that reuse the site's green-on-black aesthetic */
        .inbox-container {
            margin-top: 20px;
            width: 80%;
            max-width: 1000px;
        }
        .email-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .email-item {
            background-color: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
            font-family: 'CP437', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* Turn green on hover like the login buttons */
        .email-item:hover {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 0, 1), 0 0 20px rgba(0, 255, 0, 0.9);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }
        .email-subject {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .email-meta {
            font-size: 14px;
            opacity: 0.8;
        }
        /* Modal / email view */
        .email-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 22px;
            z-index: 10000;
            width: 80%;
            max-width: 900px;
            box-shadow: 0 0 30px rgba(0,255,0,0.6);
        }
        .email-modal.hidden { display: none; }
        .email-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .email-modal .modal-body {
            white-space: pre-wrap;
            line-height: 1.4;
            max-height: 80vh; /* increased so longer emails aren't cut off */
            overflow: auto;
            margin-bottom: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        /* reuse button styles from look.css for download and close */
        .btn {
            padding: 10px 14px;
            background-color: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-family: 'CP437', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: #00ff00;
            color: #000;
        }
        /* styled close button: shows a plain ASCII 'X', has a visible border, and stays inside the modal */
        .close-x {
            background-color: #000;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 18px;
            cursor: pointer;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            line-height: 1;
            border-radius: 4px;
        }
        .close-x:hover {
            background-color: #00ff00;
            color: #000;
        }
        .no-emails { opacity: 0.8; }
        @media(min-width:700px) {
            .email-list { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>
    <h1>inbox</h1>
    <div class="inbox-container">
        <div id="emailList" class="email-list">
            <!-- Email items injected by script -->
        </div>
    </div>

    <div id="emailModal" class="email-modal hidden" aria-hidden="true">
        <div class="modal-header">
            <div>
                <div id="modalSubject" class="email-subject">Subject</div>
                <div id="modalFrom" class="email-meta">From: someone@example.com</div>
            </div>
            <div class="modal-actions">
                <button id="closeModal" class="close-x" aria-label="Close">X</button>
            </div>
        </div>
        <div id="modalBody" class="modal-body">Email body...</div>
        <div id="modalAttachment" class="modal-attachment"></div>
    </div>

    <a href="/logout">Logout</a>

    <script>
        // Sample emails - subject, body, optional attachment path (relative to repo root)
        const emails = [
            {
                subject: 'EGG DIR CONF.',
                from: 'no-reply@sys.local',
                body: `Confirmation to deploy EGG DIR? input this code to confirm.\n8175553297`,
                attachment: null
            },
            {
                subject: 'CFRM:LOW POWER, MEETING REQUEST',
                from: 'no-reply@DRCTR.fyi',
                body: `Accepted: " we need to have a conversation about this asap bucko, we didnt make you do this just to get a couple AA batteries and some nice spreadsheets"`,
                attachment: null
            },
            {
                subject: 'ENERGY WEEKLY REVIEW',
                from: 'no-reply@xltl.local',
                body: `ENERGY PRODUCTION LEVEL METRICS, SEE ATTACHED:`,
                attachment: './attachments/datatracker.xls'
            },
            {
                subject: 'What is egg dir?',
                from: 'no-reply@sys.local',
                body: ``,
                attachment: null
            },
            {
                subject: 'Welcome to the southeast Aham power facility Gregory!',
                from: 'no-reply@sys.local',
                body: `We are so glad to welcome you to the team! We hope you become comfortable here and can contribute greatly to the cause. Please review the onboarding document for a full overview on your duties and the amenities at this facility!`,
                attachment: './attachments/Greg_Onboarding.docx'
            }
        ];

        const emailList = document.getElementById('emailList');
        const modal = document.getElementById('emailModal');
        const modalSubject = document.getElementById('modalSubject');
        const modalFrom = document.getElementById('modalFrom');
        const modalBody = document.getElementById('modalBody');
        const modalAttachment = document.getElementById('modalAttachment');
        const closeModal = document.getElementById('closeModal');

        let currentIndex = 0;

        function renderList() {
            emailList.innerHTML = '';
            if (emails.length === 0) {
                emailList.innerHTML = '<div class="no-emails">No messages</div>';
                return;
            }
            emails.forEach((e, idx) => {
                const item = document.createElement('div');
                item.className = 'email-item';
                item.setAttribute('data-index', idx);

                const left = document.createElement('div');
                // Use escapeHtml to avoid accidental HTML injection in subjects/from
                left.innerHTML = `<div class="email-subject">${escapeHtml(String(e.subject || ''))}</div><div class="email-meta">${escapeHtml(String(e.from || ''))}</div>`;

                const right = document.createElement('div');
                right.className = 'email-meta';
                right.textContent = 'Click to open';

                item.appendChild(left);
                item.appendChild(right);

                // attach event listener that captures the current idx correctly
                item.addEventListener('click', (ev) => { ev.stopPropagation(); openEmail(idx); });

                emailList.appendChild(item);
            });
        }

        function openEmail(index) {
            const email = emails[index];
            if (!email) return;
            currentIndex = index;
            modalSubject.textContent = email.subject || '';
            modalFrom.textContent = 'From: ' + (email.from || '');
            modalBody.textContent = email.body || '';

            // Attachment handling
            modalAttachment.innerHTML = '';
            if (email.attachment) {
                const a = document.createElement('a');
                a.href = String(email.attachment).trim();
                a.download = a.href.split('/').pop();
                a.className = 'btn';
                a.textContent = 'Download Attachment';
                modalAttachment.appendChild(a);
            }

            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
        }

        function closeEmail() {
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
        }

        closeModal.addEventListener('click', closeEmail);

        // close by clicking outside
        window.addEventListener('click', (ev) => {
            if (!modal.classList.contains('hidden')) {
                const rect = modal.getBoundingClientRect();
                if (ev.clientX < rect.left || ev.clientX > rect.right || ev.clientY < rect.top || ev.clientY > rect.bottom) {
                    closeEmail();
                }
            }
        });

        function escapeHtml(unsafe) {
            return String(unsafe || '')
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/\"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // initialize
        renderList();
    </script>
</body>
</html>
